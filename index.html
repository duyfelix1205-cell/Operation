<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPz Operation — Web vận hành nội bộ</title>
<meta name="description" content="Web vận hành nội bộ Showroom HPz: Cẩm nang vận hành và Bộ nội quy nội bộ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0e7490;--teal-dark:#155e75;--ink:#0f172a;--line:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;display:flex;flex-direction:column;background:#f8fafc}
header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;background:linear-gradient(90deg,var(--teal-dark),var(--teal));padding:10px 18px;box-shadow:0 2px 10px rgba(2,48,71,.25);position:sticky;top:0;z-index:10}
.brand{color:#fff;font-weight:800;font-size:1.05rem;letter-spacing:.5px;margin-right:8px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{color:#e0f2fe;text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 16px;border-radius:999px;border:1.5px solid transparent;transition:.15s}
nav.tabs a:hover{background:rgba(255,255,255,.12)}
nav.tabs a.active{background:#fff;color:var(--teal-dark);border-color:#fff}
iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<header>
<span class="brand">HPz Operation</span>
<nav class="tabs">
<a id="tab-handbook" class="active" href="hpz-aquarium-care.html" target="content">Cẩm nang vận hành</a>
<a id="tab-noiquy" href="hpz-noi-quy.html" target="content">Nội quy Showroom</a>
</nav>
</header>
<iframe name="content" id="content" src="hpz-aquarium-care.html" title="Nội dung HPz Operation"></iframe>
<script>
document.querySelectorAll('nav.tabs a').forEach(function(a){
  a.addEventListener('click',function(){
    document.querySelectorAll('nav.tabs a').forEach(function(x){x.classList.remove('active')});
    a.classList.add('active');
  });
});
</script>
</body>
</html>
